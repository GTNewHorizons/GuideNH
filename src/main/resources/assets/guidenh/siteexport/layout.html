<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="{{base}}">
    <title>{{title}}</title>
    <link rel="icon" type="image/svg+xml" href="{{root}}/_site/gtnh-favicon.svg">
    <link rel="stylesheet" href="{{root}}/_site/app.css">
    <link rel="stylesheet" href="{{root}}/_site/model-viewer.css">
    <link rel="modulepreload" href="{{root}}/_site/app.js">
  </head>
  <body class="guide-site-body">
    <main class="guide-site">
      <header class="guide-header">
        <button class="guide-mobile-nav-toggle" type="button" data-guide-mobile-nav-toggle aria-controls="guide-site-navigation" aria-expanded="false" aria-label=""><span aria-hidden="true">&#9776;</span></button>
        <div class="guide-brand">
          <a class="guide-logo" href="{{root}}/index.html">GuideNH</a>
          <a class="guide-custom-link" data-guide-custom-link hidden target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.71.5.1.68-.22.68-.49v-1.7c-2.78.62-3.37-1.22-3.37-1.22-.46-1.19-1.11-1.51-1.11-1.51-.91-.64.07-.63.07-.63 1.01.07 1.54 1.07 1.54 1.07.9 1.58 2.35 1.12 2.92.86.09-.67.35-1.12.64-1.38-2.22-.26-4.55-1.14-4.55-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.2 9.2 0 0 1 12 7.16c.85 0 1.7.12 2.5.36 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.95.68 1.92v2.84c0 .27.18.6.69.49A10.23 10.23 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z" />
            </svg>
          </a>
        </div>
        <div class="guide-header-lang">{{lang_switcher}}</div>
      </header>
      <aside class="guide-sidebar" id="guide-site-navigation">{{sidebar}}</aside>
      <button class="guide-mobile-nav-backdrop" type="button" data-guide-mobile-nav-backdrop aria-label="" tabindex="-1" hidden></button>
      <section class="guide-content">
        <article id="page-content" class="guide-page">{{content}}</article>
      </section>
    </main>
    <div class="guide-tooltip-popup" data-guide-tooltip-root hidden></div>
    <script type="module" src="{{root}}/_site/app.js"></script>
  </body>
</html>
