[package]
name = "guide-layout-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# JNI bridge
jni = "0.21"

# Layout engine
taffy = { version = "0.12", features = ["flexbox", "grid", "block_layout", "float_layout"] }

# Text shaping & rasterization
cosmic-text = "0.19"

# Rasterization
swash = "0.2"

# Serialization
flatbuffers = "24"

# Minecraft formatting code parsing
# (custom module, no external dependency needed)

[build-dependencies]
flatc = "0.2"
