<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11151c">
    <title>GuideNH Studio</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">G</span><span>GuideNH Studio</span><small>ExportSite editor</small></div>
        <div class="topbar-actions">
          <button data-action="new" title="Create a new project">New</button>
          <button data-action="import-folder" title="Import an ExportSite folder">Import folder</button>
          <button data-action="import-bundle">Import bundle</button>
          <button class="primary" data-action="export-bundle">Export bundle</button>
          <label class="language-control"><span id="site-language-label">Site</span><select id="language-select" aria-label="Site language"></select></label>
          <label class="language-control"><span id="ui-language-label">UI</span><select id="ui-language-select" aria-label="Editor language"></select></label>
          <button class="reference-button" data-action="reference" aria-haspopup="dialog" title="Syntax reference">⌘ <span id="reference-button-label">Syntax</span></button>
          <button data-action="theme" aria-label="Toggle theme">☼</button>
        </div>
        <input id="folder-input" type="file" webkitdirectory directory multiple hidden>
        <input id="bundle-input" type="file" accept=".json,.guidenh.json,.zip,application/zip,application/json" hidden>
      </header>
      <main class="workspace">
        <aside class="sidebar panel">
          <div class="panel-heading"><span>Project</span><button class="icon-button" data-action="add-page" title="Add page">＋</button></div>
          <label class="project-name"><span>Project name</span><input id="project-name" type="text"></label>
          <div class="tree-toolbar"><input id="file-filter" type="search" placeholder="Filter files"><span id="file-count"></span></div>
          <nav id="file-tree" class="file-tree" aria-label="Project files"></nav>
          <div class="storage-note"><span class="status-dot"></span><span id="save-status">Saved in this browser</span></div>
        </aside>
        <section class="editor-pane panel">
          <div class="panel-heading editor-heading"><div><span id="editor-label">index.md</span><small id="editor-meta">Markdown source</small></div><div class="editor-actions"><button data-action="format">Format</button><button data-action="download-file">Download</button></div></div>
          <textarea id="editor" spellcheck="false" aria-label="Document editor"></textarea>
          <div class="editor-footer"><span id="cursor-position">Ln 1, Col 1</span><span>UTF-8</span><span id="dirty-indicator"></span></div>
        </section>
        <section class="preview-pane panel">
          <div class="panel-heading preview-heading"><div><span>Preview</span><small id="preview-label">GuideNH site</small></div><div class="preview-actions"><label class="scroll-sync-control" title="Synchronize editor and preview scrolling"><input id="scroll-sync-toggle" type="checkbox"><span id="scroll-sync-label">Sync scroll</span></label><button data-view="desktop" class="active">Desktop</button><button data-view="mobile">Mobile</button><button data-action="refresh">Refresh</button></div></div>
          <div id="preview-frame" class="preview-frame desktop"><div id="preview-site" class="guide-site-preview"></div></div>
        </section>
      </main>
    </div>
    <dialog id="syntax-reference" class="syntax-reference" aria-labelledby="reference-title">
      <div class="reference-header">
        <div><h2 id="reference-title">Syntax &amp; examples</h2><span id="reference-subtitle"></span></div>
        <div class="reference-header-actions">
          <div class="reference-language" role="group" aria-label="Reference language"><button type="button" data-reference-language="en" aria-pressed="true">EN</button><button type="button" data-reference-language="zh" aria-pressed="false">中文</button></div>
          <button type="button" class="reference-close" data-reference-close aria-label="Close syntax reference" title="Close">×</button>
        </div>
      </div>
      <div class="reference-toolbar"><input id="reference-search" type="search" autocomplete="off" placeholder="Search syntax, tags, examples" aria-label="Search syntax reference"><span id="reference-count"></span></div>
      <div class="reference-body"><nav id="reference-results" class="reference-results" aria-label="Syntax topics"></nav><article id="reference-content" class="reference-content guide-page"></article></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
