name: Deploy web editor to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-web-editor-pages.yml
      - web-editor/public/**
      - web-editor/scripts/sync-locales.mjs
      - web-editor/package.json
      - web-editor/package-lock.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-web-editor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify site files
        run: test -f web-editor/public/index.html

      - name: Discover UI locales
        run: node web-editor/scripts/sync-locales.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-editor/public

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
